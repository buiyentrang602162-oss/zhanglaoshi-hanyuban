var SH=[['s1','Ca 1','Sáng','08:00','09:30'],['s2','Ca 2','Sáng','09:45','11:15'],['t1','Ca 1','Tối','18:00','19:30'],['t2','Ca 2','Tối','19:45','21:15']];

var STN={hoc:'Lên lớp',nghi:'Nghỉ',bu:'Học bù'};
function shOf(k){return SH.filter(function(x){return x[0]===k})[0]}
function shIdx(k){for(var i=0;i<SH.length;i++)if(SH[i][0]===k)return i;return 9}
function shName(k){var x=shOf(k);return x?x[1]+' ('+x[2].toLowerCase()+')':'Chưa chọn ca'}

function pd(s){var p=String(s).split('-');return new Date(+p[0],p[1]-1,+p[2])}
function ds(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function wd(s){return(pd(s).getDay()+6)%7+1}
function mon(s){return addD(s,1-wd(s))}
function fd(s){return s?fmt(pd(s)):''}
function fdm(s){return s?s.slice(8,10)+'/'+s.slice(5,7):''}
function fdl(s){return s?DN[wd(s)-1]+', '+fd(s):''}
function isoWk(s){var th=addD(s,4-wd(s)),d=pd(th),y=new Date(d.getFullYear(),0,1);return{w:Math.floor(Math.round((d-y)/864e5)/7)+1,y:d.getFullYear()}}
function nowHM(){var d=new Date();return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function slotsOf(c){if(c.slots&&c.slots.length)return c.slots;return(c.days||[]).map(function(d){return{d:d,sh:c.shift||'',from:c.from||'',to:c.to||''}})}
function slotFor(c,d){return slotsOf(c).filter(function(x){return x.d===d})[0]||{sh:c.shift||'',from:c.from||'',to:c.to||''}}
function slotTxt(x){return DS[x.d-1]+' · '+shName(x.sh)+(x.from&&x.to?' '+x.from+'–'+x.to:'')}
function hasPlan(c){var sl=slotsOf(c);return!!(c.start&&sl.length&&sl.every(function(x){return x.sh}))}
function plan(c){var offs={},L=[],days=slotsOf(c).map(function(x){return x.d}),mk=c.mk||[],n=0;
(c.off||[]).forEach(function(o){offs[o.d]=o});
